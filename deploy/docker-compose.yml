# One small server: PostgreSQL, the app, and Caddy (automatic HTTPS).
# Point your domain's DNS at the server first.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: billchecker
      POSTGRES_DB: billchecker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billchecker -d billchecker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not published on the host; only the app connects.

  app:
    build:
      context: ..
      args:
        SITE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://billchecker:${POSTGRES_PASSWORD}@db:5432/billchecker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
