[project]
name = "billchecker"
version = "0.1.0"
description = "Medical bill checker: extraction schemas and deterministic rules engine"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    # 1.x changes the client API; upgrade deliberately (see the SDK migration guide).
    "anthropic>=0.125,<1",
    "google-genai>=1.47",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "pillow>=10",
    "pillow-heif>=0.18",
    "reportlab>=4.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "psycopg[binary,pool]>=3.2",
    "argon2-cffi>=23",
    # Runs the photo quality model (trained with PyTorch, exported to ONNX).
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
# MCP server for AI assistants (scripts entry point: billchecker-mcp).
mcp = ["mcp>=2"]
# Training the photo quality model (scripts/train_photo_quality.py). Not needed to run the app.
ml = ["torch>=2.4", "onnx>=1.16", "onnxscript>=0.1"]
# Training the in-browser model (scripts/train_photo_quality_tf.py), served with TensorFlow.js.
ml-tf = ["tensorflow>=2.16"]
dev = [
    "mcp>=2",
    "pytest>=8",
    # scripts/ui_check.py drives the installed Google Chrome; no browser download needed.
    "playwright>=1.45",
]

[project.scripts]
billchecker-mcp = "billchecker.mcp_server:main"

[tool.setuptools.package-data]
billchecker = ["web/*", "knowledge/*", "ml/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google",
]
