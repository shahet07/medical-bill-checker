<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-label="Clyvexa: finds the mistakes in your medical bill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6fd6"/>
      <stop offset="1" stop-color="#1a4fa3"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 24) scale(0.5)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <g id="art">
    <!-- the C of Clyvexa, drawn as a magnifying glass: the app inspects the bill -->
    <path d="M354 172A132 132 0 1 0 354 340" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
    <path d="M344 358l62 62" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
    <!-- bill lines under the lens -->
    <rect x="164" y="204" width="112" height="20" rx="10" fill="#c7d8f3"/>
    <rect x="164" y="290" width="92" height="20" rx="10" fill="#c7d8f3"/>
    <!-- the line it flagged -->
    <rect x="152" y="242" width="150" height="30" rx="12" fill="#fde7b3"/>
    <rect x="164" y="247" width="84" height="20" rx="10" fill="#e8a33a"/>
    <!-- checked -->
    <path d="M326 254l22 22 44-48" fill="none" stroke="#3ed08a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
  <text x="314" y="138" font-family="Inter, 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#16233a" letter-spacing="-3">Clyvexa</text>
  <text x="318" y="210" font-family="Inter, 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f5fbf" letter-spacing="2">MEDICAL BILL CHECKER</text>
  <text x="318" y="254" font-family="Inter, 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#4a5a72">Finds the mistakes in your bill. Writes the letter.</text>
</svg>
