  </g></g><text x="320" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#1c2430" letter-spacing="-2">Clyvexa</text><text x="324" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#1f5fbf" letter-spacing="1">Medical bill checker</text></svg>