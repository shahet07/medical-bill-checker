name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billchecker
          POSTGRES_PASSWORD: test
          POSTGRES_DB: billchecker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billchecker -d billchecker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BILLCHECKER_TEST_DATABASE_URL: postgresql://billchecker:test@localhost:5432/billchecker_test
      # Tests use recorded LLM responses; no API keys or network calls.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4  # a few tests run the page's JavaScript in Node
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: TensorFlow.js model matches Keras
        run: node scripts/tfjs-parity.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t billchecker:ci .
      - name: Image contains the built frontend
        run: docker run --rm --entrypoint sh billchecker:ci -c 'test -f /app/frontend/index.html && test -d /app/frontend/_next && echo ok'
